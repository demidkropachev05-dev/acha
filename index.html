<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<title>Ачинск 3D</title>
<style>
*{
    box-sizing:border-box;
    -webkit-tap-highlight-color:transparent;
}
html,body{
    margin:0;
    width:100%;
    height:100%;
    overflow:hidden;
    background:#101418;
    touch-action:none;
    overscroll-behavior:none;
}
body{
    position:fixed;
    inset:0;
    font-family:Arial,sans-serif;
}
#game{
    position:fixed;
    inset:0;
    width:100%;
    height:100%;
    display:block;
}
#loading{
    position:fixed;
    inset:0;
    z-index:5000;
    display:flex;
    flex-direction:column;
    justify-content:center;
    align-items:center;
    background:#101418;
    color:white;
    transition:opacity .5s ease;
}
#loading.hidden{
    opacity:0;
    pointer-events:none;
}
.loadingTitle{
    font-size:26px;
    font-weight:700;
    margin-bottom:10px;
}
.loadingText{
    font-size:15px;
    opacity:.7;
    margin-bottom:20px;
}
.loadingBar{
    width:220px;
    height:5px;
    border-radius:5px;
    overflow:hidden;
    background:#303840;
}
#loadingProgress{
    width:5%;
    height:100%;
    background:#fff;
    transition:width .2s ease;
}
#hint{
    position:fixed;
    top:15px;
    left:50%;
    transform:translateX(-50%);
    z-index:3000;
    color:white;
    background:rgba(0,0,0,.45);
    padding:8px 14px;
    border-radius:12px;
    font-size:13px;
    opacity:0;
    pointer-events:none;
    transition:opacity .3s;
}
#controls{
    position:fixed;
    inset:0;
    width:100%;
    height:100%;
    z-index:2000;
    pointer-events:none;
}
#joystick{
    position:fixed;
    left:calc(24px + env(safe-area-inset-left));
    bottom:calc(24px + env(safe-area-inset-bottom));
    width:120px;
    height:120px;
    border-radius:50%;
    background:rgba(255,255,255,.10);
    border:2px solid rgba(255,255,255,.25);
    pointer-events:auto;
    touch-action:none;
    z-index:2100;
}
#stick{
    position:absolute;
    width:54px;
    height:54px;
    left:31px;
    top:31px;
    border-radius:50%;
    background:rgba(255,255,255,.42);
    border:2px solid rgba(255,255,255,.65);
    box-shadow:0 4px 18px rgba(0,0,0,.25);
}
#jump{
    position:fixed;
    right:calc(24px + env(safe-area-inset-right));
    bottom:calc(35px + env(safe-area-inset-bottom));
    width:78px;
    height:78px;
    border-radius:50%;
    border:2px solid rgba(255,255,255,.3);
    background:rgba(255,255,255,.13);
    color:white;
    font-size:15px;
    font-weight:bold;
    pointer-events:auto;
    touch-action:none;
    z-index:2100;
}
#jump:active{
    background:rgba(255,255,255,.3);
}
@media (orientation:portrait){
    #hint{
        opacity:1;
    }
}
@media (orientation:landscape){
    #joystick{
        width:115px;
        height:115px;
        left:calc(20px + env(safe-area-inset-left));
        bottom:calc(18px + env(safe-area-inset-bottom));
    }
    #stick{
        left:28px;
        top:28px;
    }
    #jump{
        width:72px;
        height:72px;
        right:calc(22px + env(safe-area-inset-right));
        bottom:calc(25px + env(safe-area-inset-bottom));
    }
}
</style>
</head>
<body>
<div id="loading">
    <div class="loadingTitle">АЧИНСК 3D</div>
    <div class="loadingText" id="loadingText">Загрузка города...</div>
    <div class="loadingBar">
        <div id="loadingProgress"></div>
    </div>
</div>
<div id="hint">Поверните телефон горизонтально</div>
<canvas id="game"></canvas>
<div id="controls">
    <div id="joystick">
        <div id="stick"></div>
    </div>
    <button id="jump">ПРЫЖОК</button>
</div>
<script type="module">
import * as THREE from
"https://cdn.jsdelivr.net/npm/three@0.180.0/build/three.module.js";
import {GLTFLoader} from
"https://cdn.jsdelivr.net/npm/three@0.180.0/examples/jsm/loaders/GLTFLoader.js";
/* =========================
   DOM
========================= */
const canvas = document.getElementById("game");
const loading = document.getElementById("loading");
const loadingProgress = document.getElementById("loadingProgress");
const loadingText = document.getElementById("loadingText");
const hint = document.getElementById("hint");
const joystick = document.getElementById("joystick");
const stick = document.getElementById("stick");
const jumpButton = document.getElementById("jump");
/* =========================
   SETTINGS
========================= */
const CITY_SIZE = 1100;
const PLAYER_SPEED = 20;
const RUN_MULTIPLIER = 1.45;
const GRAVITY = -42;
const JUMP_POWER = 15;
const ROAD_WIDTH = 26;
const ROAD_GAP = 190;
const WORLD_LIMIT = CITY_SIZE / 2 - 25;
/* =========================
   SCENE
========================= */
const scene = new THREE.Scene();
scene.background = new THREE.Color(0x8c9aa5);
scene.fog = new THREE.Fog(
    0x8c9aa5,
    250,
    850
);
/* =========================
   CAMERA
========================= */
const camera = new THREE.PerspectiveCamera(
    62,
    innerWidth / innerHeight,
    .1,
    1200
);
camera.position.set(
    0,
    7,
    13
);
/* =========================
   RENDERER
========================= */
const renderer = new THREE.WebGLRenderer({
    canvas,
    antialias:true,
    powerPreference:"high-performance"
});
renderer.setPixelRatio(
    Math.min(devicePixelRatio,1.5)
);
renderer.setSize(
    innerWidth,
    innerHeight,
    false
);
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
renderer.outputColorSpace = THREE.SRGBColorSpace;
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.05;
/* =========================
   LIGHT
========================= */
const hemi = new THREE.HemisphereLight(
    0xc5d7e8,
    0x303030,
    1.8
);
scene.add(hemi);
const sun = new THREE.DirectionalLight(
    0xffe7c0,
    2.2
);
sun.position.set(
    -250,
    350,
    150
);
sun.castShadow = true;
sun.shadow.mapSize.width = 2048;
sun.shadow.mapSize.height = 2048;
sun.shadow.camera.left = -500;
sun.shadow.camera.right = 500;
sun.shadow.camera.top = 500;
sun.shadow.camera.bottom = -500;
sun.shadow.camera.near = 1;
sun.shadow.camera.far = 1000;
scene.add(sun);
/* =========================
   MATERIALS
========================= */
const groundMat = new THREE.MeshStandardMaterial({
    color:0x4e594f,
    roughness:1
});
const roadMat = new THREE.MeshStandardMaterial({
    color:0x25282b,
    roughness:.9
});
const sidewalkMat = new THREE.MeshStandardMaterial({
    color:0x858585,
    roughness:.9
});
const curbMat = new THREE.MeshStandardMaterial({
    color:0x696969,
    roughness:1
});
const whiteMat = new THREE.MeshStandardMaterial({
    color:0xe5e5e5
});
const yellowMat = new THREE.MeshStandardMaterial({
    color:0xe6c229
});
/* =========================
   GROUND
========================= */
const ground = new THREE.Mesh(
    new THREE.PlaneGeometry(
        CITY_SIZE,
        CITY_SIZE
    ),
    groundMat
);
ground.rotation.x = -Math.PI / 2;
ground.receiveShadow = true;
scene.add(ground);
/* =========================
   ROAD
========================= */
function createRoad(
    x,
    z,
    width,
    length,
    horizontal
){
    const road = new THREE.Mesh(
        new THREE.BoxGeometry(
            horizontal ? length : width,
            .08,
            horizontal ? width : length
        ),
        roadMat
    );
    road.position.set(
        x,
        .04,
        z
    );
    road.receiveShadow = true;
    scene.add(road);
    const sidewalkSize = 4;
    const s1 = new THREE.Mesh(
        new THREE.BoxGeometry(
            horizontal ? length : sidewalkSize,
            .14,
            horizontal ? sidewalkSize : length
        ),
        sidewalkMat
    );
    const s2 = s1.clone();
    if(horizontal){
        s1.position.set(
            x,
            .11,
            z + width / 2 + sidewalkSize / 2
        );
        s2.position.set(
            x,
            .11,
            z - width / 2 - sidewalkSize / 2
        );
    }else{
        s1.position.set(
            x + width / 2 + sidewalkSize / 2,
            .11,
            z
        );
        s2.position.set(
            x - width / 2 - sidewalkSize / 2,
            .11,
            z
        );
    }
    scene.add(s1,s2);
    /* дорожная разметка */
    const dashCount = Math.floor(
        length / 16
    );
    for(let i=0;i<dashCount;i++){
        const dash = new THREE.Mesh(
            new THREE.BoxGeometry(
                horizontal ? 7 : .35,
                .035,
                horizontal ? .35 : 7
            ),
            whiteMat
        );
        const offset =
            -length/2 +
            8 +
            i*16;
        if(horizontal){
            dash.position.set(
                x + offset,
                .095,
                z
            );
        }else{
            dash.position.set(
                x,
                .095,
                z + offset
            );
        }
        scene.add(dash);
    }
}
/* =========================
   CITY ROADS
========================= */
for(
    let p = -ROAD_GAP * 2;
    p <= ROAD_GAP * 2;
    p += ROAD_GAP
){
    createRoad(
        0,
        p,
        ROAD_WIDTH,
        CITY_SIZE,
        true
    );
    createRoad(
        p,
        0,
        ROAD_WIDTH,
        CITY_SIZE,
        false
    );
}
/* =========================
   BUILDINGS
========================= */
const buildings = [];
function createBuilding(
    x,
    z,
    w,
    h,
    d
){
    const colorList = [
        0x77716c,
        0x777b7e,
        0x625e5a,
        0x85817b,
        0x575d60,
        0x817b72
    ];
    const material =
        new THREE.MeshStandardMaterial({
            color:
                colorList[
                    Math.floor(
                        Math.random()*colorList.length
                    )
                ],
            roughness:.88,
            metalness:.03
        });
    const building = new THREE.Mesh(
        new THREE.BoxGeometry(
            w,
            h,
            d
        ),
        material
    );
    building.position.set(
        x,
        h/2,
        z
    );
    building.castShadow = true;
    building.receiveShadow = true;
    scene.add(building);
    buildings.push({
        mesh:building,
        x,
        z,
        w,
        d
    });
    /* окна */
    const windowMat =
        new THREE.MeshStandardMaterial({
            color:0x27333c,
            roughness:.35,
            metalness:.1
        });
    const rows =
        Math.max(
            2,
            Math.floor(h / 4)
        );
    const colsX =
        Math.max(
            2,
            Math.floor(w / 4)
        );
    const colsZ =
        Math.max(
            2,
            Math.floor(d / 4)
        );
    for(
        let row=0;
        row<rows;
        row++
    ){
        const y =
            2 +
            row *
            ((h-4) / Math.max(1,rows-1));
        for(
            let col=0;
            col<colsX;
            col++
        ){
            const wx =
                x -
                w/2 +
                1.7 +
                col *
                ((w-3.4) /
                Math.max(1,colsX-1));
            const win =
                new THREE.Mesh(
                    new THREE.BoxGeometry(
                        1.35,
                        1.35,
                        .08
                    ),
                    windowMat
                );
            win.position.set(
                wx,
                y,
                z-d/2-.045
            );
            scene.add(win);
            const win2 =
                win.clone();
            win2.position.z =
                z+d/2+.045;
            scene.add(win2);
        }
        for(
            let col=0;
            col<colsZ;
            col++
        ){
            const wz =
                z -
                d/2 +
                1.7 +
                col *
                ((d-3.4) /
                Math.max(1,colsZ-1));
            const win =
                new THREE.Mesh(
                    new THREE.BoxGeometry(
                        .08,
                        1.35,
                        1.35
                    ),
                    windowMat
                );
            win.position.set(
                x-w/2-.045,
                y,
                wz
            );
            scene.add(win);
            const win2 =
                win.clone();
            win2.position.x =
                x+w/2+.045;
            scene.add(win2);
        }
    }
}
/* =========================
   BUILDING LAYOUT
========================= */
for(let i=0;i<95;i++){
    let x;
    let z;
    let tries = 0;
    do{
        x =
            (Math.random()-.5) *
            (CITY_SIZE-100);
        z =
            (Math.random()-.5) *
            (CITY_SIZE-100);
        tries++;
    }while(
        (
            Math.abs(
                x -
                Math.round(x/ROAD_GAP)*ROAD_GAP
            ) <
            ROAD_WIDTH+15
            ||
            Math.abs(
                z -
                Math.round(z/ROAD_GAP)*ROAD_GAP
            ) <
            ROAD_WIDTH+15
        )
        &&
        tries<50
    );
    const w =
        28 +
        Math.random()*45;
    const d =
        28 +
        Math.random()*45;
    const h =
        12 +
        Math.random()*50;
    createBuilding(
        x,
        z,
        w,
        h,
        d
    );
}
/* =========================
   TREES
========================= */
function createTree(x,z){
    const trunk =
        new THREE.Mesh(
            new THREE.CylinderGeometry(
                .45,
                .65,
                5,
                8
            ),
            new THREE.MeshStandardMaterial({
                color:0x4d3524,
                roughness:1
            })
        );
    trunk.position.set(
        x,
        2.5,
        z
    );
    trunk.castShadow = true;
    scene.add(trunk);
    const crown =
        new THREE.Mesh(
            new THREE.IcosahedronGeometry(
                3.5,
                1
            ),
            new THREE.MeshStandardMaterial({
                color:0x304d32,
                roughness:1
            })
        );
    crown.position.set(
        x,
        7,
        z
    );
    crown.castShadow = true;
    scene.add(crown);
}
for(let i=0;i<100;i++){
    const x =
        (Math.random()-.5) *
        (CITY_SIZE-100);
    const z =
        (Math.random()-.5) *
        (CITY_SIZE-100);
    createTree(x,z);
}
/* =========================
   STREET LIGHTS
========================= */
function createLamp(x,z){
    const pole =
        new THREE.Mesh(
            new THREE.CylinderGeometry(
                .16,
                .22,
                7,
                8
            ),
            new THREE.MeshStandardMaterial({
                color:0x292c2d,
                metalness:.7,
                roughness:.4
            })
        );
    pole.position.set(
        x,
        3.5,
        z
    );
    pole.castShadow = true;
    scene.add(pole);
    const lamp =
        new THREE.Mesh(
            new THREE.SphereGeometry(
                .42,
                10,
                10
            ),
            new THREE.MeshStandardMaterial({
                color:0xffdf9c,
                emissive:0xffb84d,
                emissiveIntensity:1.5
            })
        );
    lamp.position.set(
        x,
        7.1,
        z
    );
    scene.add(lamp);
}
for(
    let x=-ROAD_GAP*2;
    x<=ROAD_GAP*2;
    x+=ROAD_GAP
){
    for(
        let z=-ROAD_GAP*2;
        z<=ROAD_GAP*2;
        z+=ROAD_GAP
    ){
        createLamp(
            x+ROAD_WIDTH/2+5,
            z+ROAD_WIDTH/2+5
        );
    }
}
/* =========================
   CARS
========================= */
function createCar(x,z,rotation){
    const car =
        new THREE.Group();
    const body =
        new THREE.Mesh(
            new THREE.BoxGeometry(
                4.2,
                1.2,
                8
            ),
            new THREE.MeshStandardMaterial({
                color:
                    Math.random()>.5
                    ?0x24282b
                    :0x7c2e2e,
                roughness:.55,
                metalness:.2
            })
        );
    body.position.y=1.1;
    body.castShadow=true;
    car.add(body);
    const top =
        new THREE.Mesh(
            new THREE.BoxGeometry(
                3.4,
                1.15,
                3.7
            ),
            new THREE.MeshStandardMaterial({
                color:0x202427,
                roughness:.35,
                metalness:.15
            })
        );
    top.position.y=2;
    top.position.z=-.3;
    car.add(top);
    const wheelMat =
        new THREE.MeshStandardMaterial({
            color:0x111111,
            roughness:1
        });
    for(const wx of [-2.1,2.1]){
        for(const wz of [-2.5,2.5]){
            const wheel =
                new THREE.Mesh(
                    new THREE.CylinderGeometry(
                        .75,
                        .75,
                        .45,
                        12
                    ),
                    wheelMat
                );
            wheel.rotation.z =
                Math.PI/2;
            wheel.position.set(
                wx,
                .75,
                wz
            );
            car.add(wheel);
        }
    }
    car.position.set(
        x,
        0,
        z
    );
    car.rotation.y=rotation;
    scene.add(car);
}
for(let i=0;i<26;i++){
    const horizontal =
        Math.random()>.5;
    const road =
        Math.floor(
            Math.random()*5
        )-2;
    const offset =
        (Math.random()-.5) *
        850;
    if(horizontal){
        createCar(
            offset,
            road*ROAD_GAP +
            (Math.random()>.5?6:-6),
            0
        );
    }else{
        createCar(
            road*ROAD_GAP +
            (Math.random()>.5?6:-6),
            offset,
            Math.PI/2
        );
    }
}
/* =========================
   PLAYER
========================= */
const player =
    new THREE.Group();
player.position.set(
    0,
    0,
    40
);
scene.add(player);
let playerModel = null;
let mixer = null;
let idleAction = null;
let walkAction = null;
let runAction = null;
let currentAction = null;
/* =========================
   PLAYER FALLBACK
========================= */
function createFallback(){
    const body =
        new THREE.Mesh(
            new THREE.CapsuleGeometry(
                .55,
                1.5,
                5,
                10
            ),
            new THREE.MeshStandardMaterial({
                color:0x384d65,
                roughness:.8
            })
        );
    body.position.y=1.45;
    body.castShadow=true;
    player.add(body);
}
/* =========================
   LOAD NORMAL CHARACTER
========================= */
const loader =
    new GLTFLoader();
const CHARACTER_URL =
"https://raw.githubusercontent.com/MMWilliams/char-kit/master/characters/mh_3183.glb";
let characterLoaded=false;
loader.load(
    CHARACTER_URL,
    function(gltf){
        playerModel =
            gltf.scene;
        playerModel.scale.setScalar(
            1.65
        );
        playerModel.position.y=0;
        playerModel.traverse(
            function(obj){
                if(obj.isMesh){
                    obj.castShadow=true;
                    obj.receiveShadow=true;
                }
            }
        );
        player.add(playerModel);
        mixer =
            new THREE.AnimationMixer(
                playerModel
            );
        const animations =
            gltf.animations || [];
        if(animations.length){
            idleAction =
                mixer.clipAction(
                    animations[0]
                );
            idleAction.play();
            currentAction =
                idleAction;
            if(animations.length>1){
                walkAction =
                    mixer.clipAction(
                        animations[1]
                    );
            }
            if(animations.length>2){
                runAction =
                    mixer.clipAction(
                        animations[2]
                    );
            }
        }
        characterLoaded=true;
        loadingProgress.style.width="100%";
        setTimeout(
            hideLoading,
            200
        );
    },
    function(xhr){
        if(xhr.total){
            const p =
                Math.min(
                    95,
                    (xhr.loaded/xhr.total)*100
                );
            loadingProgress.style.width =
                p+"%";
        }
    },
    function(error){
        console.warn(
            "Персонаж не загрузился:",
            error
        );
        createFallback();
        loadingText.textContent =
            "Город готов";
        loadingProgress.style.width =
            "100%";
        setTimeout(
            hideLoading,
            300
        );
    }
);
/* =========================
   LOADING SAFETY
========================= */
let loadingHidden=false;
function hideLoading(){
    if(loadingHidden) return;
    loadingHidden=true;
    loading.classList.add("hidden");
    setTimeout(
        ()=>{
            loading.style.display="none";
        },
        550
    );
}
/*
   Если внешний GLB завис,
   игра всё равно запускается.
*/
setTimeout(
    function(){
        if(!characterLoaded){
            if(
                player.children.length===0
            ){
                createFallback();
            }
            loadingText.textContent =
                "Город готов";
            loadingProgress.style.width =
                "100%";
            hideLoading();
        }
    },
    12000
);
/* =========================
   INPUT
========================= */
let joystickX=0;
let joystickY=0;
let joystickActive=false;
let joystickPointer=null;
function resetJoystick(){
    joystickX=0;
    joystickY=0;
    stick.style.transform =
        "translate(0px,0px)";
}
function updateJoystick(
    clientX,
    clientY
){
    const rect =
        joystick.getBoundingClientRect();
    const cx =
        rect.left+
        rect.width/2;
    const cy =
        rect.top+
        rect.height/2;
    let dx =
        clientX-cx;
    let dy =
        clientY-cy;
    const max =
        rect.width/2-28;
    const length =
        Math.hypot(dx,dy);
    if(length>max){
        dx =
            dx/length*max;
        dy =
            dy/length*max;
    }
    joystickX =
        dx/max;
    joystickY =
        dy/max;
    stick.style.transform =
        `translate(${dx}px,${dy}px)`;
}
joystick.addEventListener(
    "pointerdown",
    function(e){
        joystickActive=true;
        joystickPointer=e.pointerId;
        joystick.setPointerCapture(
            e.pointerId
        );
        updateJoystick(
            e.clientX,
            e.clientY
        );
    }
);
joystick.addEventListener(
    "pointermove",
    function(e){
        if(
            !joystickActive ||
            e.pointerId!==joystickPointer
        ) return;
        updateJoystick(
            e.clientX,
            e.clientY
        );
    }
);
function endJoystick(e){
    if(
        e.pointerId!==joystickPointer
    ) return;
    joystickActive=false;
    joystickPointer=null;
    resetJoystick();
}
joystick.addEventListener(
    "pointerup",
    endJoystick
);
joystick.addEventListener(
    "pointercancel",
    endJoystick
);
joystick.addEventListener(
    "lostpointercapture",
    function(){
        joystickActive=false;
        joystickPointer=null;
        resetJoystick();
    }
);
/* =========================
   KEYBOARD
========================= */
const keys={};
window.addEventListener(
    "keydown",
    e=>{
        keys[e.code]=true;
    }
);
window.addEventListener(
    "keyup",
    e=>{
        keys[e.code]=false;
    }
);
/* =========================
   JUMP
========================= */
let verticalVelocity=0;
let grounded=true;
function jump(){
    if(!grounded) return;
    verticalVelocity =
        JUMP_POWER;
    grounded=false;
}
jumpButton.addEventListener(
    "pointerdown",
    e=>{
        e.preventDefault();
        jump();
    }
);
/* =========================
   CAMERA
========================= */
let cameraYaw=0;
let cameraPitch=.22;
let cameraDistance=12;
let cameraPointer=null;
let cameraLastX=0;
let cameraLastY=0;
canvas.addEventListener(
    "pointerdown",
    function(e){
        cameraPointer=e.pointerId;
        cameraLastX=e.clientX;
        cameraLastY=e.clientY;
        canvas.setPointerCapture(
            e.pointerId
        );
    }
);
canvas.addEventListener(
    "pointermove",
    function(e){
        if(
            cameraPointer!==e.pointerId
        ) return;
        const dx =
            e.clientX-cameraLastX;
        const dy =
            e.clientY-cameraLastY;
        cameraLastX=e.clientX;
        cameraLastY=e.clientY;
        cameraYaw -=
            dx*.006;
        cameraPitch -=
            dy*.004;
        cameraPitch =
            THREE.MathUtils.clamp(
                cameraPitch,
                -.1,
                .75
            );
    }
);
canvas.addEventListener(
    "pointerup",
    function(e){
        if(
            cameraPointer===
            e.pointerId
        ){
            cameraPointer=null;
        }
    }
);
canvas.addEventListener(
    "pointercancel",
    function(){
        cameraPointer=null;
    }
);
/* =========================
   COLLISION
========================= */
function blocked(
    x,
    z
){
    if(
        x < -WORLD_LIMIT ||
        x > WORLD_LIMIT ||
        z < -WORLD_LIMIT ||
        z > WORLD_LIMIT
    ){
        return true;
    }
    for(
        const b of buildings
    ){
        if(
            Math.abs(
                x-b.x
            ) <
            b.w/2+COLLISION_PADDING
            &&
            Math.abs(
                z-b.z
            ) <
            b.d/2+COLLISION_PADDING
        ){
            return true;
        }
    }
    return false;
}
/* =========================
   MOVEMENT
========================= */
const moveVector =
    new THREE.Vector3();
const forwardVector =
    new THREE.Vector3();
const rightVector =
    new THREE.Vector3();
const cameraOffset =
    new THREE.Vector3();
const targetCamera =
    new THREE.Vector3();
function updatePlayer(dt){
    let forward=0;
    let side=0;
    if(
        keys["KeyW"] ||
        keys["ArrowUp"]
    ){
        forward+=1;
    }
    if(
        keys["KeyS"] ||
        keys["ArrowDown"]
    ){
        forward-=1;
    }
    if(
        keys["KeyA"] ||
        keys["ArrowLeft"]
    ){
        side-=1;
    }
    if(
        keys["KeyD"] ||
        keys["ArrowRight"]
    ){
        side+=1;
    }
    /*
       ВАЖНО:
       joystick X исправлен.
       Влево = влево.
       Вправо = вправо.
    */
    forward += -joystickY;
    side += -joystickX;
    moveVector.set(
        side,
        0,
        forward
    );
    const moving =
        moveVector.lengthSq()>0.001;
    if(moving){
        moveVector.normalize();
        forwardVector.set(
            -Math.sin(cameraYaw),
            0,
            -Math.cos(cameraYaw)
        );
        rightVector.set(
            Math.cos(cameraYaw),
            0,
            -Math.sin(cameraYaw)
        );
        const worldMove =
            new THREE.Vector3();
        worldMove.addScaledVector(
            forwardVector,
            moveVector.z
        );
        worldMove.addScaledVector(
            rightVector,
            moveVector.x
        );
        worldMove.normalize();
        const running =
            keys["ShiftLeft"] ||
            keys["ShiftRight"];
        const speed =
            PLAYER_SPEED *
            (
                running
                ? RUN_MULTIPLIER
                : 1
            );
        const nx =
            player.position.x+
            worldMove.x*
            speed*
            dt;
        const nz =
            player.position.z+
            worldMove.z*
            speed*
            dt;
        if(
            !blocked(
                nx,
                player.position.z
            )
        ){
            player.position.x=nx;
        }
        if(
            !blocked(
                player.position.x,
                nz
            )
        ){
            player.position.z=nz;
        }
        const targetRotation =
            Math.atan2(
                worldMove.x,
                worldMove.z
            );
        player.rotation.y =
            THREE.MathUtils.lerp(
                player.rotation.y,
                targetRotation,
                Math.min(
                    1,
                    dt*10
                )
            );
        if(
            mixer &&
            walkAction
        ){
            const action =
                running &&
                runAction
                ? runAction
                : walkAction;
            if(
                currentAction!==action
            ){
                if(currentAction){
                    currentAction.fadeOut(.2);
                }
                action.reset()
                    .fadeIn(.2)
                    .play();
                currentAction=action;
            }
        }
    }else{
        if(
            mixer &&
            idleAction &&
            currentAction!==idleAction
        ){
            if(currentAction){
                currentAction.fadeOut(.2);
            }
            idleAction
                .reset()
                .fadeIn(.2)
                .play();
            currentAction=idleAction;
        }
    }
    /* gravity */
    verticalVelocity +=
        GRAVITY*dt;
    player.position.y +=
        verticalVelocity*dt;
    if(
        player.position.y<=0
    ){
        player.position.y=0;
        verticalVelocity=0;
        grounded=true;
    }
}
/* =========================
   CAMERA UPDATE
========================= */
function updateCamera(dt){
    const horizontal =
        Math.cos(cameraPitch) *
        cameraDistance;
    cameraOffset.set(
        Math.sin(cameraYaw)*
        horizontal,
        Math.sin(cameraPitch)*
        cameraDistance+
        3.2,
        Math.cos(cameraYaw)*
        horizontal
    );
    targetCamera.copy(
        player.position
    );
    targetCamera.y+=1.7;
    const desired =
        targetCamera.clone()
            .add(cameraOffset);
    camera.position.lerp(
        desired,
        1-Math.pow(.001,dt)
    );
    camera.lookAt(
        targetCamera
    );
}
/* =========================
   ORIENTATION
========================= */
function updateOrientation(){
    if(
        innerWidth>innerHeight
    ){
        hint.style.opacity="0";
    }else{
        hint.style.opacity="1";
        hint.textContent=
            "Поверните телефон горизонтально";
    }
    renderer.setSize(
        innerWidth,
        innerHeight,
        false
    );
    camera.aspect =
        innerWidth/innerHeight;
    camera.updateProjectionMatrix();
}
window.addEventListener(
    "resize",
    updateOrientation
);
window.addEventListener(
    "orientationchange",
    function(){
        setTimeout(
            updateOrientation,
            150
        );
    }
);
if(window.visualViewport){
    window.visualViewport.addEventListener(
        "resize",
        updateOrientation
    );
}
/* =========================
   ANIMATION
========================= */
let lastTime =
    performance.now();
function animate(now){
    requestAnimationFrame(
        animate
    );
    let dt =
        (now-lastTime)/1000;
    lastTime=now;
    dt =
        Math.min(
            dt,
            .05
        );
    if(mixer){
        mixer.update(dt);
    }
    updatePlayer(dt);
    updateCamera(dt);
    renderer.render(
        scene,
        camera
    );
}
updateOrientation();
animate(performance.now());
/* =========================
   START
========================= */
setTimeout(
    function(){
        if(
            !loadingHidden
        ){
            loadingText.textContent =
                "Запуск города...";
            loadingProgress.style.width =
                "100%";
        }
    },
    1000
);
</script>
