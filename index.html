<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<title>АЧИНСК — первая игровая сцена</title>
<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#101820;font-family:Arial,sans-serif;touch-action:none}canvas{display:block;width:100%;height:100%}
#hud{position:fixed;top:0;left:0;right:0;padding:calc(12px + env(safe-area-inset-top)) 14px 0;pointer-events:none;color:#fff;text-shadow:0 2px 4px #000}#title{font-size:20px;font-weight:800;letter-spacing:1px}#hint{font-size:12px;margin-top:4px;opacity:.9}
#status{position:fixed;left:50%;bottom:calc(16px + env(safe-area-inset-bottom));transform:translateX(-50%);padding:8px 12px;border-radius:12px;background:rgba(0,0,0,.45);color:#fff;font-size:12px;pointer-events:none;white-space:nowrap}
#controls{position:fixed;left:18px;bottom:calc(20px + env(safe-area-inset-bottom));width:150px;height:150px}.btn{position:absolute;width:58px;height:58px;border:1px solid rgba(255,255,255,.35);border-radius:18px;background:rgba(20,25,30,.62);color:#fff;font-size:25px;font-weight:700;box-shadow:0 5px 16px rgba(0,0,0,.25);display:flex;align-items:center;justify-content:center;user-select:none}.btn:active{background:rgba(255,255,255,.28);transform:scale(.96)}#up{left:46px;top:0}#left{left:0;top:46px}#down{left:46px;top:92px}#right{left:92px;top:46px}
#look{position:fixed;right:16px;bottom:calc(22px + env(safe-area-inset-bottom));width:112px;height:112px;border-radius:50%;border:1px solid rgba(255,255,255,.22);background:rgba(20,25,30,.26);color:rgba(255,255,255,.8);display:flex;align-items:center;justify-content:center;font-size:12px;text-align:center;pointer-events:auto;user-select:none}@media(min-width:800px){#controls,#look{display:none}}
</style></head><body>
<div id="hud"><div id="title">АЧИНСК • ПЕРВАЯ ИГРОВАЯ СЦЕНА</div><div id="hint">WASD / стрелки • на телефоне — кнопки и свайп справа</div></div>
<div id="status">Исследуй город</div><div id="controls"><div class="btn" id="up">▲</div><div class="btn" id="left">◀</div><div class="btn" id="down">▼</div><div class="btn" id="right">▶</div></div><div id="look">СВАЙП<br>КАМЕРЫ</div>
<script src="https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.min.js"></script><script>
(()=>{const scene=new THREE.Scene();scene.background=new THREE.Color(0x8fb8d8);scene.fog=new THREE.Fog(0x8fb8d8,55,190);const camera=new THREE.PerspectiveCamera(62,innerWidth/innerHeight,.1,500);camera.position.set(0,7,10);const renderer=new THREE.WebGLRenderer({antialias:true});renderer.setPixelRatio(Math.min(devicePixelRatio,2));renderer.setSize(innerWidth,innerHeight);renderer.shadowMap.enabled=true;renderer.shadowMap.type=THREE.PCFSoftShadowMap;document.body.prepend(renderer.domElement);
scene.add(new THREE.HemisphereLight(0xddeeff,0x486040,2));const sun=new THREE.DirectionalLight(0xffffff,2.5);sun.position.set(-45,80,35);sun.castShadow=true;sun.shadow.mapSize.set(2048,2048);scene.add(sun);const mat=c=>new THREE.MeshStandardMaterial({color:c,roughness:1});const ground=new THREE.Mesh(new THREE.PlaneGeometry(360,360),mat(0x477348));ground.rotation.x=-Math.PI/2;ground.receiveShadow=true;scene.add(ground);
function box(x,y,z,w,h,d,c){const m=new THREE.Mesh(new THREE.BoxGeometry(w,h,d),mat(c));m.position.set(x,y+h/2,z);m.castShadow=true;m.receiveShadow=true;scene.add(m);return m}function road(x,z,w,d){box(x,.015,z,w,.03,d,0x33373a);for(let p=-Math.max(w,d)/2+5;p<Math.max(w,d)/2;p+=10){if(w>d)box(x+p,.035,z,.55,.02,.09,0xe7dfad);else box(x,.035,z,.09,.02,.55,0xe7dfad)}}road(0,0,18,330);road(0,0,330,18);road(-38,-65,12,120);road(45,60,12,120);
const buildings=[[-31,-31,12,18,10,0xd5c8a9],[-10,-31,13,14,17,0xaaaeb1],[25,-28,18,15,12,0xb8b2a1],[-30,29,15,17,15,0xc8c0aa],[-7,30,12,18,9,0xb7c7cf],[29,28,17,16,20,0xc7b79e],[-67,-15,18,20,8,0xb0b6a8],[65,12,18,20,14,0xb9b0a0],[-64,55,20,18,11,0xc5c7bb],[63,-58,22,19,16,0xa8b6bd]];buildings.forEach(b=>{const[x,z,w,d,h,c]=b;box(x,0,z,w,h,d,c);for(let xx=x-w/2+2;xx<x+w/2-1;xx+=3.2)for(let yy=2.5;yy<h-1;yy+=3.2)box(xx,yy,z-d/2-.018,.95,1.15,.05,0x8ab0bd)});
box(0,0,-45,22,3,3,0x8d3434);for(let i=0;i<6;i++)box(-8+i*3.2,3,-45,2.1,12+(i%2)*3,2.1,0xc9c1ad);box(0,13,-45,19,4,1.2,0x233d52);
function tree(x,z,s=1){const t=new THREE.Mesh(new THREE.CylinderGeometry(.28*s,.4*s,3*s,8),mat(0x694a2c));t.position.set(x,1.5*s,z);t.castShadow=true;scene.add(t);const c=new THREE.Mesh(new THREE.SphereGeometry(2.1*s,12,10),mat(0x2d6635));c.position.set(x,4.1*s,z);c.castShadow=true;scene.add(c)}for(let i=0;i<85;i++){const x=(Math.random()-.5)*280,z=(Math.random()-.5)*280;if(Math.abs(x)<12||Math.abs(z)<12)continue;tree(x,z,.65+Math.random()*.55)}
const player=new THREE.Group();const body=new THREE.Mesh(new THREE.CapsuleGeometry(.65,1.4,6,12),mat(0x234c78));body.position.y=1.25;body.castShadow=true;player.add(body);const head=new THREE.Mesh(new THREE.SphereGeometry(.58,16,12),mat(0xe1b18b));head.position.y=2.65;head.castShadow=true;player.add(head);const hair=new THREE.Mesh(new THREE.SphereGeometry(.6,16,8,0,Math.PI*2,0,Math.PI/2),mat(0x2b211c));hair.position.y=2.82;player.add(hair);player.position.set(0,0,28);scene.add(player);
const keys={};addEventListener('keydown',e=>keys[e.key.toLowerCase()]=true);addEventListener('keyup',e=>keys[e.key.toLowerCase()]=false);const map={up:'w',down:'s',left:'a',right:'d'};Object.keys(map).forEach(id=>{const el=document.getElementById(id);el.addEventListener('pointerdown',e=>{e.preventDefault();keys[map[id]]=true});['pointerup','pointercancel','pointerleave'].forEach(ev=>el.addEventListener(ev,e=>{e.preventDefault();keys[map[id]]=false}))});
let yaw=0,pitch=.25,dragging=false,lx=0,ly=0;const look=document.getElementById('look');look.addEventListener('pointerdown',e=>{dragging=true;lx=e.clientX;ly=e.clientY;look.setPointerCapture(e.pointerId)});look.addEventListener('pointermove',e=>{if(!dragging)return;yaw-=(e.clientX-lx)*.012;pitch-=(e.clientY-ly)*.008;pitch=Math.max(-.35,Math.min(.65,pitch));lx=e.clientX;ly=e.clientY});look.addEventListener('pointerup',()=>dragging=false);look.addEventListener('pointercancel',()=>dragging=false);
const status=document.getElementById('status'),clock=new THREE.Clock();function animate(){requestAnimationFrame(animate);const dt=Math.min(clock.getDelta(),.05);let f=(keys.w||keys.arrowup?1:0)-(keys.s||keys.arrowdown?1:0),r=(keys.d||keys.arrowright?1:0)-(keys.a||keys.arrowleft?1:0),len=Math.hypot(f,r)||1;f/=len;r/=len;const speed=10,forward=new THREE.Vector3(Math.sin(yaw),0,Math.cos(yaw)),right=new THREE.Vector3(Math.cos(yaw),0,-Math.sin(yaw));player.position.addScaledVector(forward,f*speed*dt);player.position.addScaledVector(right,r*speed*dt);player.position.x=Math.max(-155,Math.min(155,player.position.x));player.position.z=Math.max(-155,Math.min(155,player.position.z));if(f||r){player.rotation.y=Math.atan2(forward.x*f+right.x*r,forward.z*f+right.z*r);status.textContent='Ачинск • исследование города'}else status.textContent='Исследуй город';const target=new THREE.Vector3(player.position.x,1.7,player.position.z),dist=10,cp=new THREE.Vector3(player.position.x-Math.sin(yaw)*dist,player.position.y+5.5+pitch*3,player.position.z-Math.cos(yaw)*dist);camera.position.lerp(cp,1-Math.pow(.001,dt));camera.lookAt(target);renderer.render(scene,camera)}animate();addEventListener('resize',()=>{camera.aspect=innerWidth/innerHeight;camera.updateProjectionMatrix();renderer.setSize(innerWidth,innerHeight)})})();
</script></body></html>
